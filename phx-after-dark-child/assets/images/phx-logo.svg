<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-labelledby="phx-logo-title">
	<title id="phx-logo-title">PHX After Dark — the Phoenix metro event guide</title>

	<defs>
		<linearGradient id="phx-night-h" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#141426"/>
			<stop offset="100%" stop-color="#08080F"/>
		</linearGradient>
		<linearGradient id="phx-neon-h" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#3BFFD2"/>
			<stop offset="100%" stop-color="#12F7C0"/>
		</linearGradient>
		<radialGradient id="phx-horizon-h" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.40"/>
			<stop offset="45%" stop-color="#FF8A44" stop-opacity="0.16"/>
			<stop offset="100%" stop-color="#FF9E3D" stop-opacity="0"/>
		</radialGradient>
		<clipPath id="phx-clip-h">
			<rect width="880" height="220" rx="24"/>
		</clipPath>
		<clipPath id="phx-mark-clip-h">
			<rect width="256" height="256" rx="56"/>
		</clipPath>
	</defs>

	<g clip-path="url(#phx-clip-h)">
		<rect width="880" height="220" fill="url(#phx-night-h)"/>

		<g transform="translate(36 22) scale(0.687)">
			<g clip-path="url(#phx-mark-clip-h)">
				<rect width="256" height="256" fill="url(#phx-night-h)"/>
				<ellipse cx="128" cy="222" rx="140" ry="52" fill="url(#phx-horizon-h)"/>
				<path
					fill="url(#phx-neon-h)"
					fill-rule="evenodd"
					d="M200 32A32 32 0 1 0 200 96 A32 32 0 1 0 200 32 Z M192 36 A28 28 0 1 0 192 92 A28 28 0 1 0 192 36 Z"
				/>
				<g fill="url(#phx-neon-h)">
					<rect x="118" y="74" width="20" height="130" rx="10"/>
					<rect x="90" y="150" width="36" height="18" rx="9"/>
					<rect x="90" y="118" width="18" height="50" rx="9"/>
					<rect x="126" y="126" width="42" height="18" rx="9"/>
					<rect x="150" y="100" width="18" height="44" rx="9"/>
				</g>
			</g>
		</g>

		<g transform="translate(230 0)">
			<text
				x="0" y="104"
				font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
				font-size="72"
				font-weight="700"
				letter-spacing="-1"
				fill="#FFFFFF"
			>PHX</text>

			<text
				x="152" y="104"
				font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
				font-size="72"
				font-weight="700"
				font-style="italic"
				letter-spacing="-1"
				fill="url(#phx-neon-h)"
			>After Dark</text>

			<rect x="2" y="128" width="420" height="2" fill="#FFFFFF" opacity="0.18"/>

			<text
				x="0" y="166"
				font-family="Helvetica, Arial, sans-serif"
				font-size="21"
				letter-spacing="6.5"
				fill="#B9B9C6"
			>THE PHOENIX METRO EVENT GUIDE</text>
		</g>
	</g>
</svg>
