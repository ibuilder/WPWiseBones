name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A byte-order mark before <?php sends three bytes to the browser before
      # WordPress can set a header, which blanks admin responses and corrupts
      # JSON. Plugin Check reports each one as an error. Five shipped files
      # carried one, so this is a gate, and it checks the committed zips too --
      # the zip is what a reviewer downloads, and it is built by hand.
      - name: No byte-order marks in any PHP file, source or shipped
        run: |
          status=0
          if grep -rlIP '\xEF\xBB\xBF' --include='*.php' . ; then
            echo "::error::byte-order mark found in a PHP file in the source tree"
            status=1
          fi
          for zip in *.zip; do
            [ -f "$zip" ] || continue
            dir=$(mktemp -d)
            unzip -q "$zip" -d "$dir"
            if grep -rlIP '\xEF\xBB\xBF' --include='*.php' "$dir" | sed "s#$dir/#$zip: #" | grep . ; then
              echo "::error::byte-order mark found in a PHP file inside $zip"
              status=1
            fi
            rm -rf "$dir"
          done
          exit $status

      - name: PHP syntax, every shipped package
        run: |
          status=0
          for pkg in wpwisebones wisebones-shortcodes realwise aec-forge antivig-child phx-after-dark-child tools; do
            [ -d "$pkg" ] || continue
            while IFS= read -r file; do
              php -l "$file" > /dev/null || { echo "::error file=$file::PHP parse error"; status=1; }
            done < <(find "$pkg" -name '*.php' -not -path '*/node_modules/*')
          done
          exit $status

      - name: Theme preflight
        working-directory: wpwisebones
        run: |
          npm install --no-audit --no-fund
          npm run preflight

  standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr

      - name: Install PHPCS and the WordPress standards
        run: |
          composer --no-interaction --no-plugins --working-dir=/tmp require --quiet \
            squizlabs/php_codesniffer:^3.9 \
            wp-coding-standards/wpcs:^3.1 \
            phpcsstandards/phpcsutils \
            phpcsstandards/phpcsextra
          /tmp/vendor/bin/phpcs --config-set installed_paths \
            /tmp/vendor/wp-coding-standards/wpcs,/tmp/vendor/phpcsstandards/phpcsutils,/tmp/vendor/phpcsstandards/phpcsextra

      # Escaping, sanitising, nonces, prepared SQL, text domains, enqueueing.
      # These are what a directory reviewer acts on.
      - name: Review sniffs
        run: |
          /tmp/vendor/bin/phpcs --standard=phpcs.xml.dist --report=json > /tmp/gate.json || true
          python3 tools/ci/phpcs-gate.py Review /tmp/gate.json

      # Global-scope prefixes. WordPress includes templates in global scope, so
      # a bare $container at the top of a template becomes a global that can
      # collide with core or a plugin. This was advisory while ~70 occurrences
      # were outstanding; they are renamed now, so it gates.
      - name: Prefix sniffs
        run: |
          /tmp/vendor/bin/phpcs --standard=phpcs-prefixes.xml.dist --report=json > /tmp/prefixes.json || true
          python3 tools/ci/phpcs-gate.py Prefixes /tmp/prefixes.json

  integration:
    name: Integration (real WordPress + MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli

      - name: Install WordPress
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --version=latest
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 \
            --extra-php <<'PHP'
          define( 'WP_ENVIRONMENT_TYPE', 'local' );
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          define( 'DISABLE_WP_CRON', true );
          PHP
          wp core install --url=http://localhost --title=CI --admin_user=admin \
            --admin_password=password --admin_email=ci@example.test --skip-email

      - name: Install the plugin
        run: |
          cp -r wisebones-shortcodes /tmp/wp/wp-content/plugins/
          wp --path=/tmp/wp plugin activate wisebones-shortcodes

      # The suite copies the theme into the borrowed install itself, and exits 3
      # if a copy is already there, so nothing may pre-stage wpwisebones. It puts
      # the original active theme back when it is done. See tests/README.md.
      - name: Theme integration suite
        working-directory: wpwisebones
        env:
          WPWISEBONES_TEST_WP: /tmp/wp
        run: php tests/run.php

      # A child theme that cannot even be activated is broken, and none of them
      # carry tests of their own. Staged after the suite for the reason above.
      - name: Every child theme activates
        run: |
          status=0
          cp -r wpwisebones /tmp/wp/wp-content/themes/
          for child in realwise aec-forge antivig-child phx-after-dark-child; do
            [ -d "$child" ] || continue
            cp -r "$child" /tmp/wp/wp-content/themes/
            if wp --path=/tmp/wp theme activate "$child"; then
              wp --path=/tmp/wp eval 'echo "  " . get_stylesheet() . " on " . get_template() . PHP_EOL;'
            else
              echo "::error::$child failed to activate"; status=1
            fi
          done
          wp --path=/tmp/wp theme activate wpwisebones
          exit $status

      - name: No PHP errors in the debug log
        if: always()
        run: |
          log=/tmp/wp/wp-content/debug.log
          if [ -f "$log" ] && grep -iE "wpwisebones|wisebones|realwise|aec.forge|antivig|phx" "$log" \
               | grep -iE "fatal|warning|notice|deprecated"; then
            echo "::error::The packages raised PHP errors"; exit 1
          fi
          echo "clean"

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli

      - name: Install WordPress and Plugin Check
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --version=latest
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --url=http://localhost --title=PCP --admin_user=admin \
            --admin_password=password --admin_email=ci@example.test --skip-email
          wp plugin install plugin-check --activate

      # The committed zip is what a reviewer downloads, so check that, not the
      # source tree.
      - name: Stage the plugin exactly as it ships
        run: |
          unzip -q wisebones-shortcodes.zip -d /tmp/stage
          cp -r /tmp/stage/wisebones-shortcodes /tmp/wp/wp-content/plugins/
          wp --path=/tmp/wp plugin activate wisebones-shortcodes

      # --require: the CLI command lives in the plugin's own cli.php, which
      # WP-CLI does not load on its own. Run from /tmp so a bare slug cannot
      # resolve to the checkout instead of the staged copy.
      #
      # Plugin Check prints a 'FILE: <path>' header and a single-line JSON
      # array per file, not one document. A CSV reader takes that first header
      # line as its column names and then reports every field blank, which is
      # indistinguishable from a clean plugin -- that is exactly how four
      # byte-order-mark errors passed as green. The summariser refuses to call
      # any output it cannot account for a pass.
      - name: Run Plugin Check
        run: |
          cd /tmp
          wp --path=/tmp/wp plugin check /tmp/wp/wp-content/plugins/wisebones-shortcodes \
            --require=/tmp/wp/wp-content/plugins/plugin-check/cli.php \
            --format=json --fields=file,line,column,type,code,message \
            > /tmp/pcp.json 2>/tmp/pcp.err || true
          echo "::group::Raw report (first 40 lines)"
          head -40 /tmp/pcp.json || true
          echo "--- stderr ---"
          head -20 /tmp/pcp.err || true
          echo "::endgroup::"
          python3 "$GITHUB_WORKSPACE/tools/ci/summarise-plugin-check.py" \
            wisebones-shortcodes /tmp/pcp.json /tmp/pcp.err

      - name: Upload the raw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-check-report
          path: |
            /tmp/pcp.json
            /tmp/pcp.err
          retention-days: 14
          if-no-files-found: ignore
