<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="AEC Forge listing">
  <defs>
    <linearGradient id="afbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20242b"/>
      <stop offset="1" stop-color="#15181d"/>
    </linearGradient>
    <radialGradient id="afglow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#e8600a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e8600a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="afgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#5c6470" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="600" fill="url(#afbg)"/>
  <rect width="600" height="600" fill="url(#afgrid)"/>
  <rect width="600" height="600" fill="url(#afglow)"/>

  <!-- isometric cube (AEC/BIM motif) -->
  <g fill="none" stroke="#7b8492" stroke-width="3" stroke-linejoin="round">
    <!-- top rhombus -->
    <path d="M300 205 L410 268 L300 331 L190 268 Z" fill="#5c6470" fill-opacity="0.10"/>
    <!-- left face -->
    <path d="M190 268 L300 331 L300 455 L190 392 Z" fill="#000000" fill-opacity="0.18"/>
    <!-- right face -->
    <path d="M410 268 L300 331 L300 455 L410 392 Z" fill="#000000" fill-opacity="0.30"/>
  </g>
  <!-- highlighted forge edge -->
  <path d="M300 205 L410 268 L410 392" fill="none" stroke="#e8600a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ember spark -->
  <g>
    <circle cx="410" cy="268" r="9" fill="#ff8a3d"/>
    <circle cx="410" cy="268" r="9" fill="none" stroke="#ff8a3d" stroke-opacity="0.4" stroke-width="10"/>
  </g>

  <text x="300" y="520" text-anchor="middle" font-family="Archivo, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#5c6470">AEC FORGE</text>
</svg>
